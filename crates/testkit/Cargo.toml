[package]
name = "psm-testkit"
version.workspace = true
edition.workspace = true

[[bin]]
name = "fake_sidecar"
path = "src/bin/fake_sidecar.rs"

[dependencies]
psm-core = { path = "../core" }
psm-infra = { path = "../infra" }
psm-integrations = { path = "../integrations" }
tempfile = "3"
tokio.workspace = true
serde_json.workspace = true
sha2 = "0.11"
unicode-normalization = "0.1"
rusqlite = { version = "0.40", features = ["bundled"] }
image = "0.25"
libc = "0.2"

chrono = "0.4"
chrono-tz = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[dev-dependencies]
kamadak-exif = "0.6"
rusqlite_migration = "2.6"
