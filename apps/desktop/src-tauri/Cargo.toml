[package]
name = "psm-desktop"
version.workspace = true
edition.workspace = true

[lib]
name = "psm_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
getrandom = "0.3"
psm-core = { path = "../../../crates/core" }
psm-infra = { path = "../../../crates/infra" }
psm-integrations = { path = "../../../crates/integrations" }
psm-research = { path = "../../../crates/research" }
tauri = { version = "2", features = ["specta", "protocol-asset", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "=2.7.2"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "0.0.13"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-appender = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.11"
tauri = { version = "2", features = ["test"] }
psm-testkit = { path = "../../../crates/testkit" }
tempfile = "3"

