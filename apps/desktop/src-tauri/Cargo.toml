[package]
name = "psm-desktop"
version.workspace = true
edition.workspace = true

[lib]
name = "psm_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
psm-core = { path = "../../../crates/core" }
psm-infra = { path = "../../../crates/infra" }
psm-integrations = { path = "../../../crates/integrations" }
tauri = { version = "2", features = ["specta"] }
tauri-specta = { version = "=2.0.0-rc.27", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.27", features = ["derive"] }
specta-typescript = "0.0.14"
serde.workspace = true
tracing.workspace = true

