[workspace]
members = ["crates/core", "crates/infra", "crates/integrations", "crates/testkit", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }


# P70: dependencies (image codecs, SQLite, hashing, …) run optimised in debug and test builds; the
# workspace's own crates stay unoptimised so they rebuild fast. Release builds are unaffected.
[profile.dev.package."*"]
opt-level = 2
